<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aman Kumar | Java Backend Developer</title>
<style>
:root{--bg:#f7f8fa;--surface:#fff;--text:#14171f;--muted:#5b6475;--line:#e2e5ec;--accent:#0f766e;--accent-bg:#e0f2ef;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1117;--surface:#161b24;--text:#e8ebf2;--muted:#9aa4b8;--line:#262d3a;--accent:#5eead4;--accent-bg:#12302e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1117;--surface:#161b24;--text:#e8ebf2;--muted:#9aa4b8;--line:#262d3a;--accent:#5eead4;--accent-bg:#12302e;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
nav .wrap{display:flex;align-items:center;gap:16px;height:54px;overflow-x:auto}
nav a{color:var(--muted);text-decoration:none;font-size:14px;white-space:nowrap}nav a:hover{color:var(--accent)}
nav .logo{color:var(--text);font-weight:700;margin-right:auto}
button.t{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px}
section{padding:48px 0 8px}h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 18px}
.hero{padding:72px 0 24px}.hero h1{font-size:clamp(34px,7vw,54px);line-height:1.1;margin:0 0 8px}
.hero .role{font-size:20px;color:var(--muted);margin:0 0 18px}.hero p{max-width:620px;color:var(--muted)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-block;padding:10px 18px;border-radius:10px;border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:600;font-size:15px}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
.card h3{margin:0;font-size:18px}.meta{color:var(--muted);font-size:14px;margin:2px 0 10px}
.card ul{margin:8px 0 0;padding-left:20px}.card li{margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--accent-bg);color:var(--accent);padding:3px 11px;border-radius:99px;font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:28px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}.stat b{display:block;font-size:26px;color:var(--accent)}.stat span{font-size:13px;color:var(--muted)}
input,textarea{width:100%;padding:10px 12px;margin-bottom:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit}
footer{padding:40px 0 32px;color:var(--muted);font-size:14px;text-align:center}

.hero-grid{display:grid;grid-template-columns:1.3fr .8fr;gap:32px;align-items:center}
.hero-text{min-width:0}
.hero .typed{font-size:18px;margin:0 0 14px;color:var(--text)}.typed b{color:var(--accent)}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--accent);margin-left:3px;vertical-align:-.15em;animation:blink 1s steps(1) infinite}
.photo{position:relative;justify-self:center;width:min(100%,290px);aspect-ratio:4/5;animation:pop .9s .2s ease both}
.photo::before{content:"";position:absolute;inset:-10px;border-radius:30px;background:linear-gradient(135deg,var(--accent),#7c3aed);filter:blur(26px);opacity:.4;animation:glow 5s ease-in-out infinite alternate}
.photo img{position:relative;display:block;width:100%;height:100%;object-fit:cover;border-radius:24px;border:1px solid var(--line);animation:float 6s ease-in-out infinite}
.hero-text>*{animation:up .8s ease both}
.hero-text>:nth-child(2){animation-delay:.1s}.hero-text>:nth-child(3){animation-delay:.2s}.hero-text>:nth-child(4){animation-delay:.3s}.hero-text>:nth-child(5){animation-delay:.4s}
.rv:not(.in){opacity:0}.rv.in{animation:up .7s ease both;animation-delay:var(--d,0s)}
.card{transition:border-color .25s,box-shadow .25s}.card:hover{border-color:var(--accent);box-shadow:0 10px 30px -14px var(--accent)}
.chip{transition:transform .2s}.chip:hover{transform:translateY(-2px)}
.btn{transition:transform .2s,box-shadow .2s}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px -10px var(--accent)}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:10}
.orb{position:fixed;z-index:-1;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.2;pointer-events:none;background:var(--accent)}
.o1{top:-120px;left:-120px;animation:drift 18s ease-in-out infinite alternate}
.o2{bottom:-140px;right:-120px;background:#7c3aed;animation:drift 22s ease-in-out infinite alternate-reverse}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes glow{to{opacity:.7;transform:scale(1.06)}}
@keyframes drift{to{transform:translate(80px,60px) scale(1.15)}}
@keyframes blink{50%{opacity:0}}
@media(max-width:720px){.hero-grid{grid-template-columns:1fr}.photo{order:-1;width:200px;justify-self:start}}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bar"></div><div class="orb o1"></div><div class="orb o2"></div>
<nav><div class="wrap"><span class="logo" id="logo"></span>
<a href="#about">About</a><a href="#experience">Experience</a><a href="#skills">Skills</a><a href="#projects">Projects</a><a href="#contact">Contact</a>
<button class="t" id="theme" aria-label="Toggle theme">Theme</button></div></nav>

<main class="wrap">
<header class="hero"><div class="hero-grid"><div class="hero-text"><h1 id="name"></h1><p class="role" id="role"></p><p class="typed">I work with <b id="typed"></b><span class="caret"></span></p><p id="tagline"></p>
<div class="btns" id="heroBtns"></div></div><div class="photo"><img id="photo" alt=""></div></div><div class="stats" id="stats"></div></header>

<section id="about"><h2>About</h2><div class="card"><p id="about-text" style="margin:0"></p></div></section>
<section id="experience"><h2>Experience</h2><div id="exp"></div></section>
<section id="skills"><h2>Skills</h2><div class="grid" id="skillGrid"></div></section>
<section id="projects"><h2>Projects</h2><div id="proj"></div></section>
<section id="edu"><h2>Education &amp; Certifications</h2><div class="grid" id="edugrid"></div></section>
<section id="contact"><h2>Contact</h2>
<div class="card"><p style="margin-top:0" id="contactLine"></p>
<input id="cn" placeholder="Your name"><input id="ce" placeholder="Your email"><textarea id="cm" rows="4" placeholder="Message"></textarea>
<button class="btn p" id="send" style="cursor:pointer">Send via email</button></div></section>
</main>
<footer id="foot"></footer>

<script>
/* ===== EDIT ONLY THIS BLOCK TO CUSTOMISE THE SITE ===== */
const CONFIG = {
  name: "Aman Kumar",
  role: "Java Backend Developer",
  tagline: "I build secure, scalable microservices for public-sector platforms, with a focus on authentication, identity and event-driven systems.",
  email: "aman.ak21071998@gmail.com",
  phone: "+91-6381028829",
  location: "Bengaluru, Karnataka, India",
  photo: "photo.jpg",    // path to your photo (keep photo.jpg next to index.html)
  typing: ["Spring Boot microservices","Keycloak, OAuth 2.0 and SAML","Kafka event pipelines","secure REST APIs"],
  linkedin: "https://www.linkedin.com/in/aman-kumar-1339ab199",
  github: "",            // paste your GitHub profile URL here
  resumeUrl: "",         // paste a link to your resume PDF here
  about: "Java backend developer with 4+ years of experience at TCS, building microservices with Java and Spring Boot. I own user-facing services on the National Single Window System (NSWS) for NeGD: access control, profile management, and identity and security with Keycloak (SSO, RBAC, OAuth 2.0, SAML, JWT). I enjoy performance tuning, clean API design, and sharing what I learn with my team.",
  stats: [["4+","Years experience"],["100K+","Users served by auth"],["15+","REST APIs built"],["98%","API test coverage"]],
  experience: [{
    title: "System Engineer, Java Backend Developer",
    org: "Tata Consultancy Services (TCS)",
    client: "Client: National Single Window System (NSWS), NeGD",
    period: "July 2022 to Present",
    points: [
      "Own user-centric microservices (access management, profile management) built with Java and Spring Boot.",
      "Implemented and maintain authentication and authorization on Keycloak: SSO, RBAC, OAuth 2.0, SAML and JWT handling for 100K+ users.",
      "Built an asynchronous SMS OTP delivery flow using Kafka, and configured email server integration for user notifications.",
      "Built and maintained 15+ REST APIs; reached 98% API test coverage working with frontend, QA and business teams.",
      "Improved response times by 30% through backend optimisation and caching; cut query time by 20% with indexing and query tuning.",
      "Deployed services on AWS, run CI/CD on Jenkins, and monitor with Grafana and Glowroot.",
      "Review peers' code, resolve production issues, and run knowledge-sharing sessions for teammates."
    ]}],
  skills: {
    "Backend": ["Java","Spring Boot","Microservices","REST APIs","API Design"],
    "Security & Identity": ["Keycloak","OAuth 2.0","JWT","SAML","SSO","RBAC"],
    "Messaging & Data": ["Kafka","MySQL","SQL","Query Optimisation","Indexing"],
    "Cloud & DevOps": ["AWS","Jenkins CI/CD","Git","SVN"],
    "Observability": ["Grafana","Glowroot"],
    "Tools": ["Postman","IntelliJ IDEA","STS","VS Code"]
  },
  projects: [], // add {title, desc, tech:["Java","Kafka"], link:"https://github.com/..."} objects here
  education: [
    ["MCA, Kalinga University","2020 to 2022, CGPA 8.93"],
    ["BCA, S.P.M. College, Magadh University","2016 to 2019, 70.30%"],
    ["Java and SQL Certifications, Scaler","2026"],
    ["Generative AI E1, TCS","Certification"]
  ]
};
/* ===== END OF EDITABLE BLOCK ===== */

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const C=CONFIG;
document.title=C.name+" | "+C.role;
$("logo").textContent=C.name;$("name").textContent=C.name;$("role").textContent=C.role;$("tagline").textContent=C.tagline;
$("about-text").textContent=C.about;
let b='<a class="btn p" href="#contact">Get in touch</a>';
if(C.resumeUrl)b+='<a class="btn" href="'+esc(C.resumeUrl)+'">Resume</a>';
if(C.linkedin)b+='<a class="btn" href="'+esc(C.linkedin)+'" target="_blank" rel="noopener">LinkedIn</a>';
if(C.github)b+='<a class="btn" href="'+esc(C.github)+'" target="_blank" rel="noopener">GitHub</a>';
$("heroBtns").innerHTML=b;
$("stats").innerHTML=C.stats.map(s=>'<div class="stat"><b>'+esc(s[0])+'</b><span>'+esc(s[1])+'</span></div>').join("");
$("exp").innerHTML=C.experience.map(e=>'<div class="card"><h3>'+esc(e.title)+'</h3><div class="meta">'+esc(e.org)+' · '+esc(e.period)+'<br>'+esc(e.client)+'</div><ul>'+e.points.map(p=>'<li>'+esc(p)+'</li>').join("")+'</ul></div>').join("");
$("skillGrid").innerHTML=Object.entries(C.skills).map(([k,v])=>'<div class="card" style="margin:0"><h3 style="font-size:15px;margin-bottom:10px">'+esc(k)+'</h3><div class="chips">'+v.map(x=>'<span class="chip">'+esc(x)+'</span>').join("")+'</div></div>').join("");
$("proj").innerHTML=C.projects.length?C.projects.map(p=>'<div class="card"><h3>'+esc(p.title)+'</h3><p>'+esc(p.desc)+'</p><div class="chips">'+(p.tech||[]).map(x=>'<span class="chip">'+esc(x)+'</span>').join("")+'</div>'+(p.link?'<p style="margin-bottom:0"><a href="'+esc(p.link)+'" target="_blank" rel="noopener" style="color:var(--accent)">View source</a></p>':'')+'</div>').join(""):'<div class="card"><p style="margin:0;color:var(--muted)">Personal projects are coming soon. Add them in the CONFIG block at the top of the script.</p></div>';
$("edugrid").innerHTML=C.education.map(e=>'<div class="card" style="margin:0"><h3 style="font-size:15px">'+esc(e[0])+'</h3><div class="meta" style="margin:4px 0 0">'+esc(e[1])+'</div></div>').join("");
$("contactLine").innerHTML=esc(C.location)+' · <a style="color:var(--accent)" href="mailto:'+esc(C.email)+'">'+esc(C.email)+'</a> · <a style="color:var(--accent)" href="tel:'+esc(C.phone.replace(/\s/g,""))+'">'+esc(C.phone)+'</a>';
$("foot").textContent="© "+new Date().getFullYear()+" "+C.name;
$("send").onclick=()=>{const s=encodeURIComponent("Portfolio enquiry from "+($("cn").value||"a visitor"));
const body=encodeURIComponent($("cm").value+"\n\nFrom: "+$("cn").value+" <"+$("ce").value+">");
location.href="mailto:"+C.email+"?subject="+s+"&body="+body;};
$("theme").onclick=()=>{const r=document.documentElement,d=matchMedia("(prefers-color-scheme: dark)").matches;
const cur=r.getAttribute("data-theme")||(d?"dark":"light");r.setAttribute("data-theme",cur==="dark"?"light":"dark");};

/* ===== motion ===== */
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
if(C.photo){const ph=$("photo");ph.alt=C.name;ph.onerror=()=>{ph.parentElement.style.display="none"};ph.src=C.photo}else $("photo").parentElement.style.display="none";
(function(){const el=$("typed"),w=C.typing||[];if(!w.length)return;if(RM){el.textContent=w[0];return}
let i=0,j=0,del=false;(function tick(){const s=w[i];el.textContent=s.slice(0,j);
if(!del&&j===s.length){del=true;return setTimeout(tick,1400)}
if(del&&j===0){del=false;i=(i+1)%w.length}
j+=del?-1:1;setTimeout(tick,del?35:70)})()})();
function count(b){const m=b.textContent.match(/^(\d+)(.*)$/);if(!m||RM)return;const n=+m[1],suf=m[2],t0=performance.now();
(function f(t){const p=Math.min((t-t0)/1200,1);b.textContent=Math.round(n*(1-Math.pow(1-p,3)))+suf;if(p<1)requestAnimationFrame(f)})(t0)}
const targets=document.querySelectorAll("section h2,.card,.stat");
targets.forEach((el,i)=>{el.classList.add("rv");el.style.setProperty("--d",(i%4)*.08+"s")});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add("in");io.unobserve(e.target);
if(e.target.classList.contains("stat"))count(e.target.querySelector("b"))}),{threshold:.15});
targets.forEach(el=>io.observe(el));
addEventListener("scroll",()=>{const d=document.documentElement,m=d.scrollHeight-d.clientHeight;$("bar").style.width=(m>0?d.scrollTop/m*100:0)+"%"},{passive:true});
</script>
</body>
</html>
